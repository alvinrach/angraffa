name: JobAgentApp
options:
  bundleIdPrefix: com.personal.jobagent
  deploymentTarget:
    iOS: 17.0

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  JobAgentApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: JobAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.jobagent.app
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "7R585JKNMJ"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Job Agent"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
